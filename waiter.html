<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>GO pub — Официант</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#142720; --bg-deep:#0E1D17; --panel:#1C3628; --line:#2C4A3A;
    --gold:#C79A46; --cream:#F3EEDF; --muted:#8FA08D;
    --red:#D9534F; --green:#4CAF7D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; padding-bottom:100px; }
  header{ position:sticky; top:0; z-index:20; background:var(--bg-deep); border-bottom:1px solid var(--line); padding:16px 18px; }
  header h1{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 2px; }
  header .conn{ font-size:11px; color:var(--muted); }
  header .conn.on{ color:var(--green); }
  header .conn.off{ color:var(--red); }

  main{ padding:16px 18px; max-width:520px; margin:0 auto; }

  .table-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; }
  .table-row button{
    flex:0 0 auto; width:52px; height:52px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); color:var(--cream);
    font-family:'Fraunces',serif; font-weight:700; font-size:17px;
    position:relative;
  }
  .table-row button.active{ background:var(--gold); border-color:var(--gold); color:var(--bg-deep); }
  .table-row button.occupied::after{
    content:''; position:absolute; top:5px; right:5px; width:7px; height:7px;
    border-radius:50%; background:var(--green);
  }
  .table-row button.occupied.active::after{ background:var(--bg-deep); }

  .tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .tabs button{ flex:1; padding:9px 0; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-weight:600; font-size:13px; }
  .tabs button.active{ background:var(--gold); border-color:var(--gold); color:var(--bg-deep); }

  .cat{ margin-bottom:18px; }
  .cat h3{ font-family:'Fraunces',serif; color:var(--gold); font-size:16px; margin:0 0 8px; }
  .item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .item .name{ flex:1; font-size:14.5px; }
  .item .price{ font-size:12px; color:var(--muted); }
  .item.disabled{ opacity:.55; }
  .item.disabled .name{ text-decoration:line-through; }
  .unavail-tag{ font-size:10.5px; color:var(--red); border:1px solid var(--red); border-radius:999px; padding:1px 7px; margin-left:6px; }
  .note-btn{ width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--bg-deep); color:var(--muted); font-size:13px; margin-right:4px; }
  .note-btn.has-note{ border-color:var(--gold); color:var(--gold); }
  .qty{ display:flex; align-items:center; gap:8px; }
  .qty button{ width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--bg-deep); color:var(--cream); font-size:16px; }
  .qty span{ min-width:16px; text-align:center; font-weight:600; }

  .dest-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .dest-tabs button{ flex:1; padding:9px 0; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font-weight:600; font-size:13px; }
  .dest-tabs button.active{ background:var(--gold); border-color:var(--gold); color:var(--bg-deep); }

  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip-row button{ flex:0 0 auto; white-space:nowrap; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:12.5px; font-weight:500; padding:7px 13px; border-radius:999px; }
  .chip-row button.active{ background:var(--gold); border-color:var(--gold); color:var(--bg-deep); font-weight:600; }
  .chip-row button.has-items{ border-color:var(--gold); color:var(--gold); }

  .accordion-cat{ border-bottom:1px solid var(--line); }
  .accordion-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 2px; cursor:pointer; }
  .accordion-head h3{ font-family:'Fraunces',serif; color:var(--gold); font-size:16px; margin:0; display:flex; align-items:center; gap:8px; }
  .accordion-head .count{ background:var(--gold); color:var(--bg-deep); font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; }
  .accordion-head .chevron{ color:var(--muted); font-size:13px; transition:transform .2s ease; }
  .accordion-head.open .chevron{ transform:rotate(180deg); }
  .accordion-body{ display:none; padding-bottom:8px; }
  .accordion-body.open{ display:block; }

  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--gold); color:var(--bg-deep);
    padding:14px 20px; display:flex; justify-content:space-between; align-items:center;
    font-weight:700; font-family:'Fraunces',serif; font-size:16px; z-index:30;
  }
  .cart-bar.hidden{ display:none; }

  section.board{ margin-top:6px; }
  section.board h2{ font-family:'Fraunces',serif; font-size:18px; color:var(--gold); margin-bottom:10px; }
  .ticket{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .ticket .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .ticket .table-badge{ font-family:'Fraunces',serif; font-weight:700; color:var(--gold); }
  .badge{ font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; }
  .badge.pending{ background:rgba(199,154,70,.18); color:var(--gold); }
  .badge.ready{ background:rgba(76,175,125,.18); color:var(--green); }
  .ticket .line{ font-size:13px; color:var(--cream); margin-bottom:2px; }
  .ticket .line small{ color:var(--muted); }
  .serve-btn{ margin-top:8px; width:100%; padding:10px; border:none; border-radius:10px; background:var(--green); color:#0E1D17; font-weight:700; }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }
  .day-header{ font-family:'Fraunces',serif; color:var(--gold); font-size:15px; margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .day-header:first-child{ margin-top:0; }
  .hist-ticket{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .hist-ticket .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .hist-ticket .time{ font-size:11px; color:var(--muted); }

  .lock{ position:fixed; inset:0; background:var(--bg-deep); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .lock-box{ width:100%; max-width:300px; text-align:center; }
  .lock-box h2{ font-family:'Fraunces',serif; color:var(--cream); margin-bottom:6px; }
  .lock-box p{ color:var(--muted); font-size:13px; margin-bottom:18px; }
  .lock-box input{ width:100%; text-align:center; font-size:24px; letter-spacing:8px; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--cream); margin-bottom:12px; }
  .lock-box button{ width:100%; padding:13px; border:none; border-radius:12px; background:var(--gold); color:var(--bg-deep); font-weight:700; font-size:15px; }
  .lock-box .err{ color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }
  .cancel-btn{ margin-top:8px; width:100%; padding:9px; border:1px solid var(--red); background:transparent; color:var(--red); border-radius:10px; font-weight:600; font-size:13px; }


  .table-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .table-card .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .table-card .head .num{ font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--gold); }
  .table-card .head .meta{ font-size:11.5px; color:var(--muted); }
  .table-card .all-served{ font-size:13px; color:var(--green); padding:6px 0 10px; }
  .close-table-btn{ margin-top:10px; width:100%; padding:12px; border:none; border-radius:10px; background:var(--gold); color:var(--bg-deep); font-weight:700; font-size:14px; }

  .receipt{ position:fixed; inset:0; background:rgba(14,29,23,.92); z-index:95; display:none; align-items:flex-end; justify-content:center; }
  .receipt.open{ display:flex; }
  .receipt-panel{ width:100%; max-width:400px; background:#fff; color:#111; border-radius:16px 16px 0 0; max-height:90vh; display:flex; flex-direction:column; font-family:'Inter',monospace; }
  .receipt-body{ overflow-y:auto; padding:22px 24px; }
  .receipt-body h2{ text-align:center; font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; }
  .receipt-body .sub{ text-align:center; font-size:12px; color:#666; margin-bottom:16px; }
  .receipt-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .receipt-hr{ border-top:1px dashed #bbb; margin:10px 0; }
  .receipt-item{ display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; }
  .receipt-item .rn{ flex:1; padding-right:8px; }
  .receipt-total{ display:flex; justify-content:space-between; font-family:'Fraunces',serif; font-weight:700; font-size:18px; margin-top:10px; }
  .receipt-actions{ display:flex; gap:10px; padding:16px 24px; border-top:1px solid #ddd; }
  .receipt-actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-weight:700; }
  .receipt-actions .btn-close{ background:#eee; color:#333; }
  .receipt-actions .btn-print{ background:var(--gold); color:#1b1b1b; }
  @media print{
    body *{ visibility:hidden; }
    .receipt-panel, .receipt-panel *{ visibility:visible; }
    .receipt-panel{ position:fixed; inset:0; max-height:none; border-radius:0; }
    .receipt-actions{ display:none; }
  }

  .review{ position:fixed; inset:0; background:rgba(14,29,23,.92); z-index:90; display:none; align-items:flex-end; justify-content:center; }
  .review.open{ display:flex; }
  .review-panel{ width:100%; max-width:520px; background:var(--bg); border-radius:20px 20px 0 0; max-height:85vh; display:flex; flex-direction:column; }
  .review-head{ padding:20px 20px 10px; border-bottom:1px solid var(--line); }
  .review-head h2{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 4px; }
  .review-head p{ font-size:12.5px; color:var(--muted); margin:0; }
  .review-body{ overflow-y:auto; padding:10px 20px; flex:1; }
  .review-dest{ font-family:'Fraunces',serif; color:var(--gold); font-size:14px; margin:14px 0 4px; }
  .review-line{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14.5px; }
  .review-line .n{ color:var(--muted); font-weight:600; margin-right:6px; }
  .review-actions{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); }
  .btn-outline{ flex:1; padding:13px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--cream); font-weight:600; }
  .btn-solid{ flex:2; padding:13px; border-radius:12px; border:none; background:var(--gold); color:var(--bg-deep); font-weight:700; }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <h2>GO pub · Официант</h2>
    <p id="lockMsg">Введите PIN-код официанта</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button id="pinBtn" onclick="tryPin()">Войти</button>
    <div class="err" id="pinErr"></div>
  </div>
</div>

<div class="lock" id="nameLock" style="display:none">
  <div class="lock-box">
    <h2>Как вас зовут?</h2>
    <p>Ваше имя увидят повар, бармен и менеджер</p>
    <input id="nameInput" type="text" maxlength="30" placeholder="Иван" style="letter-spacing:normal; font-size:18px; text-align:left; padding:14px 16px;">
    <button onclick="submitName()">Сохранить</button>
  </div>
</div>

<header>
  <h1>GO pub · Официант <span id="staffNameTag" onclick="openNamePrompt()" style="color:var(--gold); font-weight:600; cursor:pointer; text-decoration:underline dotted;"></span></h1>
  <div class="conn off" id="conn">подключение…</div>
  <div style="margin-top:4px;"><a href="#" onclick="openNamePrompt();return false;" style="font-size:11px;color:var(--muted);text-decoration:none;">Изменить имя</a> · <a href="#" onclick="openPinPrompt();return false;" style="font-size:11px;color:var(--muted);text-decoration:none;">Сменить PIN</a></div>
</header>

<main>
  <div class="table-row" id="tables"></div>

  <div class="tabs">
    <button class="active" onclick="setMode('order')">Новый заказ</button>
    <button onclick="setMode('board')">Столы</button>
    <button onclick="setMode('history')">История</button>
  </div>

  <div id="orderView">
    <div class="dest-tabs" id="destTabs"></div>
    <div class="chip-row" id="catChips"></div>
    <div id="catList"></div>
  </div>
  <div id="boardView" style="display:none"></div>
  <div id="historyView" style="display:none"></div>
</main>

<div class="cart-bar hidden" id="cartBar" onclick="openReview()">
  <span id="cartSummary"></span>
  <span>Создать →</span>
</div>

<div class="review" id="review">
  <div class="review-panel">
    <div class="review-head">
      <h2>Стол <span id="reviewTable"></span> — проверьте заказ</h2>
      <p>Зачитайте позиции гостю, прежде чем отправить на кухню и бар</p>
    </div>
    <div class="review-body" id="reviewBody"></div>
    <div class="review-actions">
      <button class="btn-outline" onclick="closeReview()">Изменить</button>
      <button class="btn-solid" onclick="submitOrder()">Готово — отправить</button>
    </div>
  </div>
</div>

<div class="receipt" id="receipt">
  <div class="receipt-panel">
    <div class="receipt-body" id="receiptBody"></div>
    <div class="receipt-actions">
      <button class="btn-close" onclick="closeReceipt()">Закрыть</button>
      <button class="btn-print" onclick="window.print()">Печать</button>
    </div>
  </div>
</div>

<script>
// ---- EDIT THIS after you deploy the Worker ----
const WS_URL = "wss://go-pub-orders.kuatov-party.workers.dev/ws";

const MENU = {
  kitchen: [
    { title:"Салаты", items:[["Пекинский","3 690"],["Греческий","3 590"],["Хрустящие баклажаны","3 890"],["Теплый из требухи с овощами","3 890"],["Салат GO","3 890"]]},
    { title:"Холодные закуски", items:[["Ассорти под водочку","3 990"],["Соленья","3 790"],["Кавказская нарезка","3 890"],["Мясная нарезка","6 590"],["Холодец по-домашнему","3 650"],["Мужская закуска","6 590"],["Баклажаны в панировке","3 790"]]},
    { title:"Горячие закуски", items:[["Крылья BBQ","3 590"],["Сырные палочки","3 190"],["Нагетсы","2 890"],["Луковые кольца","2 690"],["Гренки","1 990"],["Бараньи семечки","3 950"],["Жареные пельмени","3 290"],["Мини чебуречки","2 690"],["Печень с курдючком","3 790"]]},
    { title:"Супы", items:[["Пельмени домашние","2 790"],["Лапша домашняя","2 290"],["Солянка","2 690"],["Том-Ям","3 590"],["Рамён","2 990"]]},
    { title:"Море Go", items:[["Креветки пивные","4 290"],["Жаренные карасики с картофелем","3 590"],["Мойва","3 690"],["Сазан на компанию","16 590"]]},
    { title:"Street food", items:[["Beef Burger","3 890"],["Chicken Burger","3 690"],["Шаурма с курицей","3 590"],["Куриный пирог GO","5 390"],["Баскет с фри","9 290"]]},
    { title:"Пицца", items:[["Курица с грибами","3 890"],["Мексикано","3 990"],["Пицца 4 сезона","3 890"],["Маргарита","3 190"],["Пепперони","3 890"],["Сырная","3 990"]]},
    { title:"Паста", items:[["Альфредо с фетучини","3 790"],["Болоньезе","3 790"]]},
    { title:"Шашлык", items:[["Баранина","5 000"],["Телятина","5 000"],["Утка","4 590"],["Крылышки","3 990"],["Куриное филе","3 750"],["Грибы","3 750"],["Картофельный","2 450"],["Овощи гриль","2 890"]]},

    { title:"Гарнир", items:[["Рис","1 450"],["Картофельный фри","1 500"],["Картофельные дольки","1 550"],["Картошка по-домашнему","2 790"],["Соусы","800"]]},
    { title:"Дессерт", items:[["Фруктовая нарезка","7 990"],["Сладкий десерт","2 190"],["Мороженое","1 990"],["Лимон","890"],["Хлебная корзина","800"]]},
  ],
  bar: [
    { title:"Бутылочное пиво", items:[["Heineken 0.5","2 250"],["Corona Extra 0.35L","3 550"],["Krusovice Svetle 0.45L","1 590"],["Krusovice Cerne 0.45L","1 590"]]},
    { title:"Разливное пиво (0.5л)", items:[["Пражское","1 450"],["Баварское нефильтрованное","1 750"],["Budweiser Budvar","3 590"],["Guinness","3 990"]]},
    { title:"Закуски к пиву", items:[["Арахис соленый","1 690"],["Чечил","1 990"],["Чипсы","2 190"],["Фисташки соленые","2 390"],["Курт","1 990"]]},
    { title:"Водка (50мл)", items:[["Хортица","950"],["Absolut Blue","1 950"],["Tito's","2 790"],["Grey Goose","3 700"],["Belvedere","4 100"]]},
    { title:"Виски (50мл)", items:[["Ballantine's","2 350"],["Jameson","2 600"],["Jack Daniels","3 500"],["Chivas 12 y.o.","4 100"]]},
    { title:"Коктейли", items:[["Aperol Spritz","3 190"],["Gin Tonic","2 790"],["Long Island","3 290"],["Cuba Libre","2 590"],["Mimosa","2 490"],["Mojito","2 690"]]},
    { title:"Безалкогольные", items:[["Coca-Cola","1 990"],["Минеральная вода","1 150"],["Сок","2 390"],["Red Bull","2 450"],["Лимонады","2 790"]]},
    { title:"Чай/Кофе", items:[["Чай в ассортименте","800"],["Jacobs кофе","1 300"]]},
  ]
};

const ROLE = "waiter";
let socket = null;
let currentTable = null;
let mode = "order";
let activeDest = "kitchen";
let openCat = null;
let cart = {}; // key: "kitchen|Название" -> {name, qty, dest, price}
let allOrders = [];
let allHistory = [];
let openTables = {};
let tableCount = 20;
let staffId = null;
let staffName = "";
let unavailable = {};

// --- staff-token auth (QR link) with legacy PIN fallback ---
(function initStaffId(){
  const url = new URL(window.location.href);
  const fromUrl = url.searchParams.get('staff');
  if(fromUrl){
    localStorage.setItem('gopub_staff_id_'+ROLE, fromUrl);
    url.searchParams.delete('staff');
    window.history.replaceState({}, '', url.pathname + url.search);
  }
  staffId = localStorage.getItem('gopub_staff_id_'+ROLE);
})();

function getPin(){ return sessionStorage.getItem("gopub_pin_"+ROLE); }
function setPin(p){ sessionStorage.setItem("gopub_pin_"+ROLE, p); }

function tryPin(){
  const p = document.getElementById('pinInput').value.trim();
  if(!p) return;
  setPin(p);
  document.getElementById('pinErr').textContent = "";
  connect();
}

function showLock(err){
  if(staffId){
    document.getElementById('lockMsg').textContent = "Не удалось подтвердить это устройство. Попросите менеджера прислать новую QR-ссылку.";
    document.getElementById('pinInput').style.display = 'none';
    document.getElementById('pinBtn').style.display = 'none';
  }
  document.getElementById('lock').style.display = 'flex';
  document.getElementById('pinErr').textContent = err || "";
  document.getElementById('pinInput').value = "";
}
function hideLock(){ document.getElementById('lock').style.display = 'none'; }

function showNameLock(){
  document.getElementById('nameInput').value = staffName || "";
  document.getElementById('nameLock').style.display = 'flex';
}
function hideNameLock(){ document.getElementById('nameLock').style.display = 'none'; }
function openNamePrompt(){ showNameLock(); }
function submitName(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return;
  staffName = name;
  if(staffId){
    socket.send(JSON.stringify({type:"set_staff_name", staffId, name}));
  } else {
    localStorage.setItem('gopub_display_name_'+ROLE, name);
    socket.send(JSON.stringify({type:"set_display_name", name}));
  }
  hideNameLock();
  updateStaffNameTag();
}
function updateStaffNameTag(){
  document.getElementById('staffNameTag').textContent = staffName ? "— " + staffName : "— указать имя";
}

let lastPinAttempt = null;
function openPinPrompt(){
  const p1 = prompt("Новый PIN для входа (4-6 цифр):");
  if(p1 === null) return;
  const clean = p1.trim();
  if(!/^\d{4,6}$/.test(clean)){ alert("PIN должен состоять из 4-6 цифр"); return; }
  lastPinAttempt = clean;
  socket.send(JSON.stringify({type:"change_pin", role:ROLE, newPin:clean}));
}

function connect(){
  const pin = staffId ? null : getPin();
  if(!staffId && !pin){ showLock(); return; }
  socket = new WebSocket(WS_URL);
  socket.onopen = () => {
    document.getElementById('conn').textContent = "в сети"; document.getElementById('conn').className = "conn on";
    const payload = {type:"hello", role:ROLE};
    if(staffId) payload.staffId = staffId; else payload.pin = pin;
    socket.send(JSON.stringify(payload));
  };
  socket.onclose = () => { document.getElementById('conn').textContent = "нет связи — переподключение…"; document.getElementById('conn').className = "conn off"; setTimeout(connect, 2000); };
  socket.onerror = () => socket.close();
  socket.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if(msg.type === "auth_ok"){
      hideLock();
      if(!staffId){
        const cached = localStorage.getItem('gopub_display_name_'+ROLE);
        if(cached){ staffName = cached; socket.send(JSON.stringify({type:"set_display_name", name:cached})); updateStaffNameTag(); }
        else updateStaffNameTag();
      }
    }
    if(msg.type === "auth_error"){
      if(!staffId) sessionStorage.removeItem("gopub_pin_"+ROLE);
      showLock(staffId ? "" : "Неверный PIN");
    }
    if(msg.type === "state"){
      allOrders = msg.orders;
      allHistory = msg.history || [];
      openTables = msg.openTables || {};
      tableCount = msg.tableCount || 20;
      unavailable = msg.unavailable || {};
      if(staffId){
        const me = (msg.staff || []).find(s => s.id === staffId);
        if(me){
          staffName = me.name || "";
          updateStaffNameTag();
          if(!staffName) showNameLock(); else hideNameLock();
        }
      }
      renderTables();
      renderChips();
      renderMenu();
      renderBoard();
      if(mode === 'history') renderHistory();
    }
    if(msg.type === "pin_changed"){
      if(!staffId) setPin(lastPinAttempt);
      alert("PIN обновлён. Запомните новый PIN — он понадобится при следующем входе.");
    }
    if(msg.type === "pin_change_error"){ alert("Не удалось изменить PIN — используйте 4-6 цифр."); }
    if(msg.type === "items_removed"){
      alert("Эти позиции только что стали недоступны и не попали в заказ: " + msg.names.join(", "));
    }
    if(msg.type === "notify"){ alertReady(msg); }
    if(msg.type === "table_closed"){ showReceipt(msg.receipt); }
    if(msg.type === "close_error"){
      if(msg.reason === "pending_items") alert("У стола ещё есть неподанные позиции — сначала выдайте их гостю.");
      else alert("Не удалось закрыть стол.");
    }
  };
}

function alertReady(msg){
  try{ new Audio("data:audio/wav;base64,UklGRhwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play(); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
  if("Notification" in window && Notification.permission === "granted"){
    new Notification("Стол " + msg.table + " — готово (" + (msg.part==='kitchen'?'кухня':'бар') + ")");
  }
  setMode('board');
}

function renderTables(){
  const el = document.getElementById('tables');
  el.innerHTML = "";
  for(let i=1;i<=tableCount;i++){
    const b = document.createElement('button');
    b.textContent = i;
    b.onclick = () => { currentTable = i; renderTables(); updateCartBar(); };
    let cls = [];
    if(currentTable===i) cls.push('active');
    if(openTables[i]) cls.push('occupied');
    b.className = cls.join(' ');
    el.appendChild(b);
  }
}

function setMode(m){
  mode = m;
  const idx = {order:0, board:1, history:2}[m];
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active', i===idx));
  document.getElementById('orderView').style.display = m==='order' ? '' : 'none';
  document.getElementById('boardView').style.display = m==='board' ? '' : 'none';
  document.getElementById('historyView').style.display = m==='history' ? '' : 'none';
  if(m==='board') renderBoard();
  if(m==='history') renderHistory();
}

function catCount(dest, cat){
  return cat.items.reduce((s,[name]) => s + (cart[dest+"|"+name] ? cart[dest+"|"+name].qty : 0), 0);
}

function renderDestTabs(){
  const el = document.getElementById('destTabs');
  el.innerHTML = `
    <button class="${activeDest==='kitchen'?'active':''}" onclick="setDest('kitchen')">Кухня</button>
    <button class="${activeDest==='bar'?'active':''}" onclick="setDest('bar')">Бар</button>`;
}

function setDest(dest){
  activeDest = dest;
  openCat = null;
  renderChips();
  renderDestTabs();
  renderMenu();
}

function renderChips(){
  const el = document.getElementById('catChips');
  el.innerHTML = "";
  MENU[activeDest].forEach(cat => {
    const b = document.createElement('button');
    const n = catCount(activeDest, cat);
    b.textContent = cat.title + (n>0 ? ` (${n})` : '');
    b.className = (openCat===cat.title ? 'active' : (n>0 ? 'has-items' : ''));
    b.onclick = () => selectCategory(cat.title);
    el.appendChild(b);
  });
}

function selectCategory(title){
  openCat = (openCat===title) ? null : title;
  renderChips();
  renderMenu();
  if(openCat){
    setTimeout(() => {
      const node = document.getElementById('acc-'+cssSafe(title));
      if(node) node.scrollIntoView({behavior:'smooth', block:'start'});
    }, 30);
  }
}

function renderMenu(){
  const el = document.getElementById('catList');
  let html = "";
  MENU[activeDest].forEach(cat => {
    const isOpen = openCat === cat.title;
    const n = catCount(activeDest, cat);
    html += `<div class="accordion-cat" id="acc-${cssSafe(cat.title)}">
      <div class="accordion-head ${isOpen?'open':''}" onclick="selectCategory('${cat.title.replace(/'/g,"\\'")}')">
        <h3>${cat.title} ${n>0?`<span class="count">${n}</span>`:''}</h3>
        <span class="chevron">▾</span>
      </div>
      <div class="accordion-body ${isOpen?'open':''}">`;
    cat.items.forEach(([name, price]) => {
      const key = activeDest+"|"+name;
      const qty = cart[key] ? cart[key].qty : 0;
      const unavail = unavailable[key];
      if(unavail){
        html += `<div class="item disabled" onclick="showUnavailReason('${name.replace(/'/g,"\\'")}','${(unavail.comment||'').replace(/'/g,"\\'")}')">
          <div class="name">${name} <span class="unavail-tag">нет в наличии</span></div>
          <div class="price">${price}</div>
        </div>`;
        return;
      }
      const note = cart[key] ? cart[key].note : "";
      html += `<div class="item">
        <div class="name">${name}</div>
        <div class="price">${price}</div>
        <button class="note-btn ${note?'has-note':''}" onclick="editNote('${activeDest}','${name.replace(/'/g,"\\'")}','${price}')" title="Комментарий">💬</button>
        <div class="qty">
          <button onclick="changeQty('${activeDest}','${name.replace(/'/g,"\\'")}',-1)">−</button>
          <span id="qty-${activeDest}-${cssSafe(name)}">${qty}</span>
          <button onclick="changeQty('${activeDest}','${name.replace(/'/g,"\\'")}',1,'${price}')">+</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  el.innerHTML = html;
}
function cssSafe(s){ return s.replace(/[^a-zA-Zа-яА-Я0-9]/g,'_'); }

function changeQty(dest, name, delta, price){
  const key = dest+"|"+name;
  const current = cart[key] ? cart[key].qty : 0;
  const existingPrice = cart[key] ? cart[key].price : price;
  const existingNote = cart[key] ? cart[key].note : "";
  const next = Math.max(0, current + delta);
  if(next===0) delete cart[key];
  else cart[key] = { name, qty: next, dest, price: existingPrice, note: existingNote };
  const span = document.getElementById('qty-'+dest+'-'+cssSafe(name));
  if(span) span.textContent = next;
  renderChips();
  updateCartBar();
}

function showUnavailReason(name, comment){
  alert(name + " временно недоступно" + (comment ? ":\n" + comment : "."));
}

function editNote(dest, name, price){
  const key = dest+"|"+name;
  if(!cart[key]){ alert("Сначала добавьте позицию (нажмите +), потом можно оставить комментарий."); return; }
  const current = cart[key].note || "";
  const note = prompt("Комментарий к позиции «" + name + "» (например: без перца, без молока):", current);
  if(note === null) return;
  cart[key].note = note.trim();
  renderMenu();
}

function updateCartBar(){
  const keys = Object.keys(cart);
  const bar = document.getElementById('cartBar');
  if(keys.length===0 || !currentTable){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const totalItems = keys.reduce((s,k)=>s+cart[k].qty,0);
  document.getElementById('cartSummary').textContent = `Стол ${currentTable} · ${totalItems} поз.`;
}

function openReview(){
  if(!currentTable){ alert("Сначала выберите стол"); return; }
  document.getElementById('reviewTable').textContent = currentTable;
  const body = document.getElementById('reviewBody');
  let html = "";
  ["kitchen","bar"].forEach(dest => {
    const lines = Object.values(cart).filter(i=>i.dest===dest);
    if(lines.length===0) return;
    html += `<div class="review-dest">${dest==='kitchen'?'Кухня':'Бар'}</div>`;
    lines.forEach(i => html += `<div class="review-line"><span><span class="n">${i.qty}×</span>${i.name}${i.note?` <em style="color:var(--gold);font-style:normal;font-size:12px;">— ${i.note}</em>`:''}</span></div>`);
  });
  body.innerHTML = html;
  document.getElementById('review').classList.add('open');
}
function closeReview(){
  document.getElementById('review').classList.remove('open');
}

function submitOrder(){
  if(!currentTable){ alert("Сначала выберите стол"); return; }
  const kitchenItems = Object.values(cart).filter(i=>i.dest==='kitchen').map(i=>({name:i.name, qty:i.qty, price:i.price, note:i.note||''}));
  const barItems = Object.values(cart).filter(i=>i.dest==='bar').map(i=>({name:i.name, qty:i.qty, price:i.price, note:i.note||''}));
  if(kitchenItems.length===0 && barItems.length===0) return;
  const payload = {type:"new_order", table: currentTable, kitchenItems, barItems};
  socket.send(JSON.stringify(payload));
  cart = {};
  renderChips();
  renderMenu();
  updateCartBar();
  closeReview();
  setMode('board');
}

function renderBoard(){
  const el = document.getElementById('boardView');
  const tableNums = Object.keys(openTables).map(Number).sort((a,b)=>a-b);
  if(tableNums.length===0){ el.innerHTML = `<div class="empty">Открытых столов нет</div>`; return; }
  let html = "";
  tableNums.forEach(t => {
    const session = openTables[t];
    const ordersForTable = allOrders.filter(o => o.table === t).sort((a,b)=>a.createdAt-b.createdAt);
    html += `<div class="table-card">
      <div class="head"><span class="num">Стол ${t}</span><span class="meta">открыт ${timeAgo(session.openedAt)}</span></div>`;
    if(ordersForTable.length===0){
      html += `<div class="all-served">Все поданные позиции выданы гостю ✓</div>`;
    } else {
      ordersForTable.forEach(o => {
        const kReady = o.kitchenStatus==='ready' || o.kitchenStatus==='none';
        const bReady = o.barStatus==='ready' || o.barStatus==='none';
        html += `<div class="ticket">`;
        if(o.kitchenItems.length){
          html += `<div class="line"><span class="badge ${o.kitchenStatus==='ready'?'ready':'pending'}">${o.kitchenStatus==='ready'?'Кухня готова':(o.kitchenStatus==='accepted'?'Кухня готовит':'Кухня: в очереди')}</span></div>`;
          o.kitchenItems.forEach(i=> html += `<div class="line">${i.name} <small>× ${i.qty}</small>${i.note?` <em style="color:var(--gold);font-style:normal;">— ${i.note}</em>`:''}</div>`);
        }
        if(o.barItems.length){
          html += `<div class="line" style="margin-top:6px;"><span class="badge ${o.barStatus==='ready'?'ready':'pending'}">${o.barStatus==='ready'?'Бар готов':(o.barStatus==='accepted'?'Бар готовит':'Бар: в очереди')}</span></div>`;
          o.barItems.forEach(i=> html += `<div class="line">${i.name} <small>× ${i.qty}</small>${i.note?` <em style="color:var(--gold);font-style:normal;">— ${i.note}</em>`:''}</div>`);
        }
        if(kReady && bReady){
          html += `<button class="serve-btn" onclick="serveOrder('${o.id}')">Выдано гостю</button>`;
        } else {
          html += `<button class="cancel-btn" onclick="cancelOrder('${o.id}')">Отменить заказ</button>`;
        }
        html += `</div>`;
      });
    }
    html += `<button class="close-table-btn" onclick="closeTable(${t})">Закрыть стол — сформировать чек</button>`;
    html += `</div>`;
  });
  el.innerHTML = html;
}
function timeAgo(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  return m<1 ? "только что" : m+" мин назад";
}

function dayLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString()) return "Сегодня";
  if(d.toDateString()===yesterday.toDateString()) return "Вчера";
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
}

function renderHistory(){
  const el = document.getElementById('historyView');
  const mine = allHistory.filter(o => o.waiterName === staffName).sort((a,b)=>b.servedAt-a.servedAt);
  if(mine.length===0){ el.innerHTML = `<div class="empty">Пока нет поданных заказов</div>`; return; }
  let html = "";
  let lastDay = null;
  mine.forEach(o => {
    const day = dayLabel(o.servedAt);
    if(day !== lastDay){ html += `<div class="day-header">${day}</div>`; lastDay = day; }
    html += `<div class="hist-ticket">
      <div class="top"><span class="table-badge">Стол ${o.table}</span><span class="time">${new Date(o.servedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
    o.kitchenItems.forEach(i => html += `<div class="line">${i.name} <small>× ${i.qty}</small>${i.note?` <em style="color:var(--gold);font-style:normal;">— ${i.note}</em>`:''}</div>`);
    o.barItems.forEach(i => html += `<div class="line">${i.name} <small>× ${i.qty}</small>${i.note?` <em style="color:var(--gold);font-style:normal;">— ${i.note}</em>`:''}</div>`);
    html += `</div>`;
  });
  el.innerHTML = html;
}

function closeTable(t){
  if(!confirm("Закрыть стол " + t + " и сформировать чек?")) return;
  socket.send(JSON.stringify({type:"close_table", table:t}));
}

function showReceipt(r){
  const body = document.getElementById('receiptBody');
  let html = `<h2>GO pub</h2>
    <div class="sub">Стол ${r.table}</div>
    <div class="receipt-row"><span>Открыт</span><span>${new Date(r.openedAt).toLocaleString('ru-RU')}</span></div>
    <div class="receipt-row"><span>Закрыт</span><span>${new Date(r.closedAt).toLocaleString('ru-RU')}</span></div>
    <div class="receipt-hr"></div>`;
  r.items.forEach(i => {
    const sum = parseInt(String(i.price).replace(/[^\d]/g,''),10) * i.qty;
    html += `<div class="receipt-item"><span class="rn">${i.qty} × ${i.name}</span><span>${sum.toLocaleString('ru-RU')}</span></div>`;
  });
  html += `<div class="receipt-hr"></div>
    <div class="receipt-row"><span>Сумма</span><span>${r.subtotal.toLocaleString('ru-RU')} тг</span></div>
    <div class="receipt-row"><span>Обслуживание (10%)</span><span>${r.service.toLocaleString('ru-RU')} тг</span></div>
    <div class="receipt-total"><span>Итого</span><span>${r.total.toLocaleString('ru-RU')} тг</span></div>`;
  body.innerHTML = html;
  document.getElementById('receipt').classList.add('open');
}
function closeReceipt(){
  document.getElementById('receipt').classList.remove('open');
}

function cancelOrder(id){
  if(!confirm("Отменить этот заказ?")) return;
  socket.send(JSON.stringify({type:"cancel_order", orderId:id}));
}

function serveOrder(id){
  socket.send(JSON.stringify({type:"served", orderId:id}));
}

if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
renderTables();
renderDestTabs();
renderChips();
renderMenu();
connect();
</script>
</body>
</html>
